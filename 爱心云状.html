<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Spatial Installation - Y-Axis Nebula</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-touch-callout: none; -webkit-user-select: none;
        }
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background-color: #000000;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
        }
        canvas {
            display: block; width: 100%; height: 100%;
            position: absolute; top: 0; left: 0; z-index: 1;
        }

        /* 艺术策展控制面板 */
        .curator-panel {
            position: absolute;
            top: 20px; left: 20px;
            width: 310px;
            background: rgba(4, 4, 6, 0.75);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 18px;
            z-index: 10;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }
        .art-title { font-size: 0.85rem; font-weight: bold; color: #ff2a6d; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; }
        .art-subtitle { font-size: 0.65rem; color: #555; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 6px; }
        .ctrl-row { margin-bottom: 12px; }
        .ctrl-row label { display: block; font-size: 0.65rem; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .value-badge { float: right; color: #ff2a6d; font-family: monospace; font-size: 0.65rem; }

        input[type="text"] {
            width: 100%; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 4px; padding: 6px 10px; color: #fff; font-size: 0.75rem; outline: none; letter-spacing: 1px;
        }
        input[type="range"] { width: 100%; accent-color: #ff2a6d; cursor: pointer; height: 2px; background: #222; }

        .color-pickers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .color-item { display: flex; align-items: center; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 5px; border-radius: 4px; }
        .color-item span { font-size: 0.6rem; color: #666; text-transform: uppercase; flex-grow: 1; }
        input[type="color"] { border: none; width: 18px; height: 18px; background: transparent; cursor: pointer; }

        #webcam { display: none; }

        .installation-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 200;
            transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .enter-btn {
            background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.15);
            padding: 14px 35px; font-size: 0.75rem; text-transform: uppercase;
            letter-spacing: 4px; cursor: pointer; transition: 0.3s;
        }
        .enter-btn:hover { border-color: #ff2a6d; background: #fff; color: #000; box-shadow: 0 0 30px rgba(255, 42, 109, 0.4); }
        .status-tracker { font-size: 0.6rem; color: #333; margin-top: 15px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="installation-overlay" id="overlay">
        <button class="enter-btn" id="startBtn">Initialize Y-Axis 3D Space</button>
        <div class="status-tracker">Spatial Matrix Engine v5.0 • Y-Axis Mode</div>
    </div>

    <div class="curator-panel">
        <div class="art-title">3D Y-Axis Heart</div>
        <div class="art-subtitle">True Thickness Installation</div>
        
        <div class="ctrl-row">
            <label>Matrix Core Text</label>
            <input type="text" id="nameInput" value="Y-VORTEX">
        </div>
        <div class="ctrl-row">
            <label>左右自转速度 <span class="value-badge" id="spinVal">2.2x</span></label>
            <input type="range" id="spinRange" min="0.5" max="5" step="0.1" value="2.2">
        </div>
        <div class="ctrl-row">
            <label>云层厚度 (纵深感) <span class="value-badge" id="thicknessVal">60</span></label>
            <input type="range" id="thicknessRange" min="20" max="120" step="5" value="60">
        </div>
        <div class="ctrl-row">
            <label>Fluid Core Density <span class="value-badge" id="countVal">380</span></label>
            <input type="range" id="countRange" min="100" max="700" step="10" value="380">
        </div>
        <div class="ctrl-row">
            <label>Aesthetic Scale <span class="value-badge" id="radiusVal">12</span></label>
            <input type="range" id="radiusRange" min="5" max="25" step="0.5" value="12">
        </div>
        <div class="ctrl-row">
            <div class="color-pickers">
                <div class="color-item"><span>Nebula</span><input type="color" id="partColor" value="#ff2a6d"></div>
                <div class="color-item"><span>Glow</span><input type="color" id="textColor" value="#ffffff"></div>
            </div>
        </div>
    </div>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="particleCanvas"></canvas>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        const videoElement = document.getElementById('webcam');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('startBtn');

        const nameInput = document.getElementById('nameInput');
        const partColorInput = document.getElementById('partColor');
        const textColorInput = document.getElementById('textColor');
        const radiusRange = document.getElementById('radiusRange');
        const countRange = document.getElementById('countRange');
        const spinRange = document.getElementById('spinRange');
        const thicknessRange = document.getElementById('thicknessRange');

        const bindBadge = (slider, badgeId, unit = "") => {
            slider.addEventListener('input', () => document.getElementById(badgeId).innerText = slider.value + unit);
        };
        bindBadge(countRange, 'countVal');
        bindBadge(radiusRange, 'radiusVal');
        bindBadge(spinRange, 'spinVal', 'x');
        bindBadge(thicknessRange, 'thicknessVal');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // --- 全局手势与 Y 轴动力学状态 ---
        const hand = { 
            x: 0, y: 0, active: false, mode: 'none',
            lastRawX: 0.5,
            rotationY: 0,       // 持续累加的 Y 轴自转弧度
            inertiaX: 0         // 横向挥手带来的自转冲力
        };

        const particles = [];
        const fov = 400; // 透视相机焦距

        // 精确的心形数学公式
        function getHeartPos(angle, scale) {
            const sinA = Math.sin(angle);
            const x = 16 * Math.pow(sinA, 3);
            const y = 13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle);
            return { x: x * scale, y: -y * scale };
        }

        class SpatialYParticle {
            constructor() {
                this.angle = Math.random() * Math.PI * 2;
                
                // 【核心升级】：建立真 3D 球体随机散射向量，确保侧面旋转绝无死角
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                
                this.randDirX = Math.sin(phi) * Math.cos(theta);
                this.randDirY = Math.sin(phi) * Math.sin(theta);
                this.randDirZ = Math.cos(phi);

                this.angularSpeed = (Math.random() * 0.012 + 0.008) * (Math.random() > 0.5 ? 1 : -1);
                this.baseSize = Math.random() * 1.6 + 0.6;
                
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                
                this.renderX = this.x;
                this.renderY = this.y;
                this.colorAlpha = 1;
                this.depthZ = 0; 
                this.isVisible3D = true;
            }

            update(rotY) {
                const baseScale = parseFloat(radiusRange.value);
                const tConfig = parseFloat(thicknessRange.value);

                if (hand.active) {
                    this.angle += this.angularSpeed * 2.2;

                    let currentScale = baseScale;
                    let cloudThickness = tConfig;

                    if (hand.mode === 'contract') { currentScale = baseScale * 0.25; cloudThickness = tConfig * 0.2; } 
                    else if (hand.mode === 'expand') { currentScale = baseScale * 1.8; cloudThickness = tConfig * 2.3; } 
                    else if (hand.mode === 'victory') { currentScale = baseScale * 1.15; cloudThickness = tConfig * 0.75; }

                    const offset = getHeartPos(this.angle, currentScale);

                    // 1. 生成未旋转前的 3D 原始局部空间点
                    let localX = offset.x + this.randDirX * cloudThickness;
                    let localY = offset.y + this.randDirY * cloudThickness;
                    let localZ = this.randDirZ * cloudThickness;

                    // 2. 【核心重构】：执行精准的 Y 轴三维旋转矩阵方程（实现左右自转）
                    const cosY = Math.cos(rotY);
                    const sinY = Math.sin(rotY);

                    let rotatedX = localX * cosY + localZ * sinY;
                    let rotatedY = localY;
                    let rotatedZ = -localX * sinY + localZ * cosY;

                    this.depthZ = rotatedZ; // 挂载深度，用于 Painter 排序

                    // 3. 安全防护：防止粒子越过相机视网膜崩溃
                    if (fov + rotatedZ <= 10) {
                        this.isVisible3D = false;
                        return;
                    }
                    this.isVisible3D = true;

                    // 4. 计算 3D 透视投影
                    let perspective = fov / (fov + rotatedZ);
                    this.size = Math.max(0.1, this.baseSize * perspective);
                    
                    // 侧面补光算法：当转到侧面时，增强基础阿尔法通道，凸显云层厚度细节
                    const sideViewBrighten = Math.abs(Math.sin(rotY)) * 0.25;
                    this.colorAlpha = Math.max(0.15, Math.min(1.0, perspective * 0.72 + sideViewBrighten));

                    let targetX = hand.x + rotatedX * perspective;
                    let targetY = hand.y + rotatedY * perspective;

                    // 缓动流体跟随
                    this.x += (targetX - this.x) * 0.16;
                    this.y += (targetY - this.y) * 0.16;
                    this.renderX = this.x;
                    this.renderY = this.y;

                } else {
                    this.x += this.vx * 0.5;
                    this.y += this.vy * 0.5;
                    if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                    if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
                    this.renderX = this.x;
                    this.renderY = this.y;
                    this.size = this.baseSize;
                    this.depthZ = 0;
                    this.isVisible3D = true;
                }
            }

            draw(r, g, b) {
                if (!this.isVisible3D) return;
                ctx.beginPath();
                ctx.arc(this.renderX, this.renderY, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${hand.active ? this.colorAlpha : 0.75})`;
                ctx.fill();
            }
        }

        function updatePool() {
            const target = parseInt(countRange.value);
            if (particles.length < target) {
                while(particles.length < target) particles.push(new SpatialYParticle());
            } else if (particles.length > target) {
                particles.splice(target);
            }
        }

        function drawSpatialMesh(r, g, b) {
            if (!hand.active) return;
            ctx.lineWidth = 0.25;

            for (let i = 0; i < particles.length; i++) {
                if (!particles[i].isVisible3D) continue;
                for (let j = i + 1; j < particles.length; j += 2) {
                    if (!particles[j].isVisible3D) continue;
                    let dx = particles[i].renderX - particles[j].renderX;
                    let dy = particles[i].renderY - particles[j].renderY;
                    let dist = Math.hypot(dx, dy);

                    let maxLinkDist = hand.mode === 'expand' ? 52 : 35;

                    if (dist < maxLinkDist) {
                        let avgAlpha = (particles[i].colorAlpha + particles[j].colorAlpha) / 2;
                        let alpha = (1 - dist / maxLinkDist) * 0.16 * avgAlpha;
                        ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].renderX, particles[i].renderY);
                        ctx.lineTo(particles[j].renderX, particles[j].renderY);
                        ctx.stroke();
                    }
                }
            }
        }

        function renderLoop() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            updatePool();

            // 基础自转流速 + 左右挥手的横向惯性冲力
            const baseSpinSpeed = parseFloat(spinRange.value) * 0.007;
            hand.inertiaX *= 0.92; 
            hand.rotationY += baseSpinSpeed + hand.inertiaX;

            let hex = partColorInput.value;
            let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            let r = parseInt(result[1], 16), g = parseInt(result[2], 16), b = parseInt(result[3], 16);

            // 3D 深度正向画家排序算法
            particles.forEach(p => p.update(hand.rotationY));
            particles.sort((a, b) => b.depthZ - a.depthZ); 
            
            particles.forEach(p => p.draw(r, g, b));
            drawSpatialMesh(r, g, b);

            // 完美的 Y 轴立体自转文字投影
            if (hand.active && hand.mode === 'victory') {
                ctx.save();
                
                // 文字跟随 Y 轴左右翻转产生的宽度缩放（基于正弦波模拟空间翻转）
                const textCosY = Math.abs(Math.cos(hand.rotationY));
                const dynamicFontSize = Math.max(14, 24 * (textCosY * 0.3 + 0.7));

                ctx.font = `900 ${dynamicFontSize}px -apple-system, sans-serif`;
                ctx.fillStyle = textColorInput.value;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.letterSpacing = "6px";
                
                ctx.shadowBlur = 25;
                ctx.shadowColor = partColorInput.value;
                
                // 让文字水平方向随着自转产生左右的空间简谐拉伸位移
                const baseScale = radiusRange.value;
                
                // 压缩文字的物理渲染画布，使其在水平面上旋转时产生极为逼真的扁平 3D 空间转动感
                ctx.translate(hand.x, hand.y + baseScale * 2);
                ctx.scale(Math.cos(hand.rotationY), 1); // 核心：水平 3D 缩放

                ctx.globalAlpha = Math.max(0.2, textCosY);
                ctx.fillText(nameInput.value, 0, 0);
                ctx.restore();
            }

            requestAnimationFrame(renderLoop);
        }
        renderLoop();

        // --- AI 手势横向位移增量惯性解算 ---
        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                hand.active = true;
                const landmarks = results.multiHandLandmarks[0];

                // 捕捉手掌横向 X 轴划动速度，注入自转动能
                const currentRawX = landmarks[9].x;
                const deltaX = currentRawX - hand.lastRawX;
                hand.lastRawX = currentRawX;

                // 在镜头前向左或向右猛烈挥手，可以瞬间加速或逆转爱心的左右自转
                if (Math.abs(deltaX) > 0.002) {
                    hand.inertiaX -= deltaX * 0.22; // 镜像反转
                }

                const targetX = (1 - landmarks[9].x) * canvas.width;
                const targetY = landmarks[9].y * canvas.height;
                
                hand.x += (targetX - hand.x) * 0.35;
                hand.y += (targetY - hand.y) * 0.35;

                const isIndexUp = landmarks[8].y < landmarks[6].y;
                const isMiddleUp = landmarks[12].y < landmarks[10].y;
                const isRingUp = landmarks[16].y < landmarks[14].y;
                const isPinkyUp = landmarks[20].y < landmarks[18].y;

                if (isIndexUp && isMiddleUp && !isRingUp && !isPinkyUp) {
                    hand.mode = 'victory';
                } else {
                    const wrist = landmarks[0];
                    let totalD = 0;
                    [4, 8, 12, 16, 20].forEach(id => totalD += Math.hypot(landmarks[id].x - wrist.x, landmarks[id].y - wrist.y));
                    hand.mode = (totalD / 5 < 0.23) ? 'contract' : 'expand';
                }
            } else {
                hand.active = false;
                hand.mode = 'none';
            }
        }

        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.65, minTrackingConfidence: 0.65 });
        hands.onResults(onResults);

        let camera = null;
        startBtn.addEventListener('click', () => {
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 600);

            camera = new Camera(videoElement, {
                onFrame: async () => { await hands.send({ image: videoElement }); },
                width: 256, height: 192
            });
            camera.start();
        });
    </script>
</body>
</html>
